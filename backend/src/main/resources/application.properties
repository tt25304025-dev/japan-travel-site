# =============================================================================
# Travel Agency — configuration
# Override any value with environment variables (recommended for production).
# Suggested MySQL database name: travel_agency
# =============================================================================

spring.application.name=travel-agency

# Server
server.port=${SERVER_PORT:8080}

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_agency?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Local default below matches many Windows/MySQL installs. Override with SPRING_DATASOURCE_PASSWORD (required in production).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (explicit dialect helps startup if JDBC metadata is temporarily unavailable)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File uploads (images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Static files: "../" is the project root when you run from the backend/ folder (development).
# For a production JAR, copy the frontend into src/main/resources/static/ and change this line.
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:../

# JWT — set JWT_SECRET in production (at least 32 characters)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Reviews: when true, new reviews need admin approval before appearing publicly
reviews.require-approval=${REVIEWS_REQUIRE_APPROVAL:false}

# First admin user (created only when the users table is empty). Override in production.
app.admin.seed-email=${ADMIN_SEED_EMAIL:admin@travel.com}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:admin123}

# CORS: comma-separated origins, or * for any (dev only). Example: https://mysite.com,https://www.mysite.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
