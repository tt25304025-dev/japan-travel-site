# =============================================================================
# Travel Agency — configuration
# Override any value with environment variables (recommended for production).
# Suggested MySQL database name: travel_agency
# =============================================================================

spring.application.name=travel-agency

# Server
server.port=${PORT:8080}

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_agency?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Set SPRING_DATASOURCE_PASSWORD in the environment (see env.example). Default matches local MySQL only.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (explicit dialect helps startup if JDBC metadata is temporarily unavailable)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File uploads (images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Static files: "../" is the project root when you run from the backend/ folder (development).
# For a production JAR, copy the frontend into src/main/resources/static/ and change this line.
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:../

# JWT — set JWT_SECRET in the environment for production (at least 32 UTF-8 bytes). See env.example.
# Default is a project-local dev fallback; override in deployment.
jwt.secret=${JWT_SECRET:SB9BESEvvar956EPgme/fApr7/DdmHMsBoJQKQ63zBQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Reviews: when true, new reviews need admin approval before appearing publicly
reviews.require-approval=${REVIEWS_REQUIRE_APPROVAL:false}

# First admin user (created only when the users table is empty).
# Override with ADMIN_SEED_EMAIL / ADMIN_SEED_PASSWORD in production if needed.
app.admin.seed-email=${ADMIN_SEED_EMAIL:nijojapan@gmail.com}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:nijo@123}

# CORS: comma-separated origins (no spaces). Production: https://nijotours.com,https://www.nijotours.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
