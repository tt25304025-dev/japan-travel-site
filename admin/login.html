<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Travel Agency</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1f36 0%, #2d3561 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h1 { color: #1a1f36; margin-bottom: 8px; font-size: 24px; }
        .sub { color: #666; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: #40485e; }
        button { width: 100%; padding: 14px; background: #40485e; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #2d3561; }
        .error { background: #fee; color: #c00; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
        .back { display: inline-block; margin-top: 16px; color: #40485e; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .login-logo { display: block; margin: 0 auto 20px; max-height: 64px; width: auto; object-fit: contain; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="/imgs/logo.jpg" alt="Nijro Travel" class="login-logo">
        <h1>Admin Login</h1>
        <p class="sub">Travel Agency Management</p>
        <div class="error" id="error"></div>
        <form method="post" action="/admin/login" id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" id="email" placeholder="nijojapan@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <a href="/" class="back">← Back to website</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            document.getElementById('error').textContent = 'Invalid email or password.';
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
