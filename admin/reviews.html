<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-yes { background: #d4edda; color: #155724; }
        .badge-no { background: #f8d7da; color: #721c24; }
        .preview { max-width: 280px; font-size: 13px; color: #555; line-height: 1.4; max-height: 48px; overflow: hidden; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <a href="/admin/dashboard" class="admin-brand"><img src="/imgs/logo.jpg" alt="Nijro Travel" class="admin-logo"></a>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/hero">Hero Slides</a>
        <a href="/admin/locations">Locations</a>
        <a href="/admin/packages">Packages</a>
        <a href="/admin/bookings">Bookings</a>
        <a href="/admin/faqs">FAQs</a>
        <a href="/admin/reviews" class="active">Reviews</a>
        <a href="/admin/social-feed">Social Feed</a>
        <a href="/" target="_blank">View Site</a>
        <a href="/admin/logout" class="logout">Logout</a>
    </nav>
    <main class="admin-main">
        <h1>Customer Reviews</h1>
        <p style="color:#666;margin-bottom:20px;">Edit, approve, hide, or delete reviews. Hidden or unapproved reviews are not shown on the public site.</p>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Rating</th>
                        <th>Text</th>
                        <th>Approved</th>
                        <th>Visible</th>
                        <th style="width:140px">Actions</th>
                    </tr>
                </thead>
                <tbody id="reviewsTable"></tbody>
            </table>
        </div>
    </main>
    <div class="modal" id="modal">
        <div class="modal-content" style="max-width:560px;">
            <h2 id="modalTitle">Edit review</h2>
            <form id="reviewForm">
                <input type="hidden" id="revId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="revName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="revEmail" required>
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" id="revCountry">
                </div>
                <div class="form-group">
                    <label>Rating (1–5)</label>
                    <input type="number" id="revRating" min="1" max="5" required>
                </div>
                <div class="form-group">
                    <label>Review text</label>
                    <textarea id="revText" rows="6" required></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL (optional)</label>
                    <input type="text" id="revImageUrl" placeholder="https://... or /uploads/...">
                </div>
                <div class="form-group">
                    <label>Upload image (optional)</label>
                    <input type="file" id="revImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="revApproved"> Approved (visible to public if also visible)</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="revVisible"> Visible on website</label>
                </div>
                <div class="form-row">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/config.js"></script>
    <script src="/admin/admin.js"></script>
    <script>
        let allReviews = [];

        function loadReviews() {
            apiFetch('/reviews').then(r => r.json()).then(data => {
                allReviews = data;
                renderTable();
            }).catch(() => {
                document.getElementById('reviewsTable').innerHTML = '<tr><td colspan="8">Failed to load. <a href="/admin/login">Login</a></td></tr>';
            });
        }

        function fmtDate(d) {
            if (!d) return '-';
            try { return new Date(d).toLocaleString(); } catch (e) { return d; }
        }

        function renderTable() {
            const tb = document.getElementById('reviewsTable');
            if (!allReviews.length) {
                tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px;">No reviews yet.</td></tr>';
                return;
            }
            tb.innerHTML = allReviews.map(r => `
                <tr>
                    <td style="white-space:nowrap;font-size:13px">${fmtDate(r.createdAt)}</td>
                    <td>${escHtml(r.name)}</td>
                    <td style="font-size:13px">${escHtml(r.email)}</td>
                    <td>${r.rating}</td>
                    <td><div class="preview">${escHtml(r.text)}</div></td>
                    <td><span class="badge ${r.approved ? 'badge-yes' : 'badge-no'}">${r.approved ? 'Yes' : 'No'}</span></td>
                    <td><span class="badge ${r.visible !== false ? 'badge-yes' : 'badge-no'}">${r.visible !== false ? 'Yes' : 'No'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editRev(${r.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteRev(${r.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        function editRev(id) {
            const r = allReviews.find(x => x.id === id);
            if (!r) return;
            document.getElementById('revId').value = r.id;
            document.getElementById('revName').value = r.name || '';
            document.getElementById('revEmail').value = r.email || '';
            document.getElementById('revCountry').value = r.country || '';
            document.getElementById('revRating').value = r.rating || 5;
            document.getElementById('revText').value = r.text || '';
            document.getElementById('revApproved').checked = !!r.approved;
            document.getElementById('revVisible').checked = r.visible !== false;
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        function deleteRev(id) {
            if (!confirm('Delete this review permanently?')) return;
            apiFetch('/reviews/' + id, { method: 'DELETE' }).then(r => { if (r.ok) loadReviews(); }).catch(showError);
        }

        document.getElementById('reviewForm').onsubmit = function (e) {
            e.preventDefault();
            const id = document.getElementById('revId').value;
            const dto = {
                id: parseInt(id, 10),
                name: document.getElementById('revName').value.trim(),
                email: document.getElementById('revEmail').value.trim(),
                country: document.getElementById('revCountry').value.trim() || null,
                rating: parseInt(document.getElementById('revRating').value, 10),
                text: document.getElementById('revText').value.trim(),
                imageUrl: document.getElementById('revImageUrl').value.trim() || null,
                approved: document.getElementById('revApproved').checked,
                visible: document.getElementById('revVisible').checked
            };
            const fd = new FormData();
            fd.append('review', new Blob([JSON.stringify(dto)], { type: 'application/json' }));
            const img = document.getElementById('revImage').files[0];
            if (img) fd.append('image', img);
            apiFetch('/reviews/' + id, { method: 'PUT', body: fd })
                .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                .then(() => { closeModal(); loadReviews(); })
                .catch(() => showError('Failed to save.'));
        };

        loadReviews();
    </script>
</body>
</html>
