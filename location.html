<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location - Nijo Travel & Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1a1f36; --brand: #c0392b; --muted: #64748b;
            --light: #f8fafc; --card: #fff; --radius: 16px;
        }
        body { font-family: 'Raleway', sans-serif; background: var(--light); color: #333; line-height: 1.7; overflow-x: hidden; }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header bar */
        .loc-header { background: var(--navy); padding: 16px 24px; position: sticky; top: 0; z-index: 100; }
        .loc-header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .loc-header a { color: #fff; font-weight: 600; font-size: 15px; }
        .loc-header .brand { font-family: 'Playfair Display', serif; font-size: 20px; }

        /* Hero */
        .loc-hero { position: relative; height: 55vh; min-height: 360px; background-size: cover; background-position: center; }
        .loc-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.1) 60%); display: flex; align-items: flex-end; padding: 40px 24px; }
        .loc-hero-text { max-width: 1100px; margin: 0 auto; width: 100%; color: #fff; }
        .loc-hero-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 4px; }
        .loc-hero-text .city-tag { font-size: 16px; opacity: .85; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* Content */
        .loc-content { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

        /* Info bar */
        .info-bar { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 36px; }
        .info-chip { background: var(--card); border-radius: 12px; padding: 14px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); flex: 1; min-width: 200px; }
        .info-chip .ic-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
        .info-chip .ic-value { font-size: 15px; font-weight: 600; color: var(--navy); }

        /* Sections */
        .loc-section { margin-bottom: 40px; }
        .loc-section h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--navy); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
        .loc-section p, .loc-section li { font-size: 16px; line-height: 1.8; color: #444; }

        /* Highlights */
        .highlights-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .highlight-tag { background: linear-gradient(135deg, #fff5f5, #fff); border: 1px solid #fecaca; border-radius: 50px; padding: 8px 20px; font-size: 14px; font-weight: 600; color: var(--brand); }

        /* Gallery */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .gallery-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
        .gallery-grid img:hover { transform: scale(1.03); box-shadow: 0 8px 24px rgba(0,0,0,.15); }

        /* Video */
        .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; margin-top: 8px; }
        .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Map */
        .map-wrap { border-radius: 12px; overflow: hidden; height: 350px; margin-top: 8px; }
        .map-wrap iframe { width: 100%; height: 100%; border: none; }

        /* Access */
        .access-box { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }

        /* Nearby */
        .nearby-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .nearby-tag { background: #f1f5f9; border-radius: 50px; padding: 8px 18px; font-size: 14px; font-weight: 600; color: var(--navy); }

        /* Custom details */
        .custom-details { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); white-space: pre-line; font-size: 15px; }

        /* Back link */
        .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; font-weight: 600; font-size: 15px; }

        /* Loading */
        .loc-loading { text-align: center; padding: 80px 24px; font-size: 18px; color: var(--muted); }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 1000; align-items: center; justify-content: center; cursor: pointer; }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 32px; cursor: pointer; background: none; border: none; }

        /* Footer */
        .loc-footer { background: var(--navy); color: rgba(255,255,255,.6); text-align: center; padding: 24px; font-size: 14px; }

        @media (max-width: 768px) {
            .loc-hero { height: 40vh; min-height: 280px; }
            .loc-hero-overlay { padding: 28px 16px; }
            .loc-content { padding: 32px 16px; }
            .info-bar { flex-direction: column; }
            .info-chip { min-width: 0; width: 100%; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .gallery-grid img { height: 140px; }
            .map-wrap { height: min(280px, 50vh); }
            .loc-header-inner { flex-wrap: wrap; gap: 12px; }
        }
        @media (max-width: 480px) {
            .loc-hero-text h1 { font-size: 1.65rem; }
            .highlight-tag { font-size: 13px; padding: 8px 14px; }
        }
    </style>
</head>
<body>
    <header class="loc-header">
        <div class="loc-header-inner">
            <a href="/" class="brand"><img src="/imgs/logo.jpg" alt="Nijro Travel & Tours" style="height:40px;"></a>
            <a href="/#locations-section">&larr; All Locations</a>
        </div>
    </header>

    <div id="loc-hero" class="loc-hero" style="background-image:url('')">
        <div class="loc-hero-overlay">
            <div class="loc-hero-text">
                <div class="city-tag" id="loc-city"></div>
                <h1 id="loc-name"></h1>
            </div>
        </div>
    </div>

    <main class="loc-content" id="loc-content" style="display:none">
        <a href="/#locations-section" class="back-link">&larr; Back to all locations</a>

        <div id="loc-desc" class="loc-section"></div>

        <div class="info-bar" id="info-bar"></div>

        <div id="sec-highlights" class="loc-section" style="display:none">
            <h2>Highlights</h2>
            <div class="highlights-grid" id="loc-highlights"></div>
        </div>

        <div id="sec-full-desc" class="loc-section" style="display:none">
            <h2>About This Place</h2>
            <div id="loc-full-desc"></div>
        </div>

        <div id="sec-gallery" class="loc-section" style="display:none">
            <h2>Gallery</h2>
            <div class="gallery-grid" id="loc-gallery"></div>
        </div>

        <div id="sec-video" class="loc-section" style="display:none">
            <h2>Video</h2>
            <div id="loc-video"></div>
        </div>

        <div id="sec-access" class="loc-section" style="display:none">
            <h2>Access & Getting There</h2>
            <div class="access-box" id="loc-access"></div>
        </div>

        <div id="sec-map" class="loc-section" style="display:none">
            <h2>Map</h2>
            <div class="map-wrap" id="loc-map"></div>
        </div>

        <div id="sec-nearby" class="loc-section" style="display:none">
            <h2>Nearby Places</h2>
            <div class="nearby-list" id="loc-nearby"></div>
        </div>

        <div id="sec-custom" class="loc-section" style="display:none">
            <h2>Additional Information</h2>
            <div class="custom-details" id="loc-custom"></div>
        </div>
    </main>

    <div class="loc-loading" id="loc-loading">Loading location details...</div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lb-close">&times;</button>
        <img id="lb-img" src="" alt="">
    </div>

    <footer class="loc-footer">&copy; Nijo Travel & Tours. All rights reserved.</footer>
    <script src="/js/config.js"></script>
    <script src="/js/seasonal-effect.js"></script>

    <script>
    (function () {
        var pathParts = window.location.pathname.split('/');
        var locId = pathParts[pathParts.length - 1];
        if (!locId || isNaN(locId)) { document.getElementById('loc-loading').textContent = 'Location not found.'; return; }

        fetch((typeof window.apiUrl === 'function' ? window.apiUrl('/api/locations/' + locId) : '/api/locations/' + locId))
            .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(render)
            .catch(function () { document.getElementById('loc-loading').textContent = 'Failed to load location.'; });

        function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        function render(loc) {
            document.getElementById('loc-loading').style.display = 'none';
            document.getElementById('loc-content').style.display = '';
            document.title = loc.name + ' - Nijo Travel & Tours';

            if (loc.imageUrl) document.getElementById('loc-hero').style.backgroundImage = 'url(' + loc.imageUrl + ')';
            document.getElementById('loc-name').textContent = loc.name || '';
            document.getElementById('loc-city').textContent = loc.city || '';

            if (loc.description) {
                document.getElementById('loc-desc').innerHTML = '<p style="font-size:18px;color:#555;margin-bottom:8px">' + esc(loc.description) + '</p>';
            }

            var bar = document.getElementById('info-bar');
            var chips = '';
            if (loc.openingHours) chips += '<div class="info-chip"><div class="ic-label">Opening Hours</div><div class="ic-value">' + esc(loc.openingHours) + '</div></div>';
            if (loc.closedDays) chips += '<div class="info-chip"><div class="ic-label">Closed</div><div class="ic-value">' + esc(loc.closedDays) + '</div></div>';
            if (loc.admissionFee) chips += '<div class="info-chip"><div class="ic-label">Admission</div><div class="ic-value">' + esc(loc.admissionFee) + '</div></div>';
            if (loc.address) chips += '<div class="info-chip"><div class="ic-label">Address</div><div class="ic-value">' + esc(loc.address) + '</div></div>';
            bar.innerHTML = chips;
            if (!chips) bar.style.display = 'none';

            if (loc.highlights && loc.highlights.length) {
                document.getElementById('sec-highlights').style.display = '';
                document.getElementById('loc-highlights').innerHTML = loc.highlights.map(function (h) { return '<span class="highlight-tag">' + esc(h) + '</span>'; }).join('');
            }

            if (loc.fullDescription) {
                document.getElementById('sec-full-desc').style.display = '';
                var paragraphs = loc.fullDescription.split('\n').filter(function (p) { return p.trim(); });
                document.getElementById('loc-full-desc').innerHTML = paragraphs.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
            }

            if (loc.galleryImages && loc.galleryImages.length) {
                document.getElementById('sec-gallery').style.display = '';
                document.getElementById('loc-gallery').innerHTML = loc.galleryImages.map(function (url) {
                    return '<img src="' + url + '" alt="Gallery" onclick="openLightbox(this.src)">';
                }).join('');
            }

            if (loc.videoUrl) {
                document.getElementById('sec-video').style.display = '';
                var vUrl = loc.videoUrl;
                if (vUrl.indexOf('youtube.com/watch') > -1) {
                    vUrl = vUrl.replace('watch?v=', 'embed/');
                } else if (vUrl.indexOf('youtu.be/') > -1) {
                    vUrl = vUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }
                document.getElementById('loc-video').innerHTML = '<div class="video-wrap"><iframe src="' + vUrl + '" allowfullscreen></iframe></div>';
            }

            if (loc.accessInfo) {
                document.getElementById('sec-access').style.display = '';
                document.getElementById('loc-access').innerHTML = '<p>' + esc(loc.accessInfo).replace(/\n/g, '<br>') + '</p>';
            }

            if (loc.latitude && loc.longitude) {
                document.getElementById('sec-map').style.display = '';
                document.getElementById('loc-map').innerHTML = '<iframe src="https://www.google.com/maps?q=' + loc.latitude + ',' + loc.longitude + '&z=15&output=embed" allowfullscreen loading="lazy"></iframe>';
            }

            if (loc.nearbyPlaces && loc.nearbyPlaces.length) {
                document.getElementById('sec-nearby').style.display = '';
                document.getElementById('loc-nearby').innerHTML = loc.nearbyPlaces.map(function (p) { return '<span class="nearby-tag">' + esc(p) + '</span>'; }).join('');
            }

            if (loc.customDetails) {
                document.getElementById('sec-custom').style.display = '';
                document.getElementById('loc-custom').textContent = loc.customDetails;
            }
        }

        window.openLightbox = function (src) {
            document.getElementById('lb-img').src = src;
            document.getElementById('lightbox').classList.add('open');
        };
        document.getElementById('lb-close').addEventListener('click', function () {
            document.getElementById('lightbox').classList.remove('open');
        });
        document.getElementById('lightbox').addEventListener('click', function (e) {
            if (e.target === this) this.classList.remove('open');
        });
    })();
    </script>
</body>
</html>
