services:
  - type: web
    name: nijotours-web
    env: java
    plan: free
    buildCommand: bash build.sh
    startCommand: java -jar backend/target/travel-agency-1.0.0.jar
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://nijotours.com,https://www.nijotours.com
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: REVIEWS_REQUIRE_APPROVAL
        value: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
